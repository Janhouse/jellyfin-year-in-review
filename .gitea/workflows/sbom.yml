name: SBOM Generation
run-name: ${{ gitea.actor }} is generating SBOM 📋

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Builder"]
    types:
      - completed

env:
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}

jobs:
  sbom:
    runs-on: ubuntu-latest
    # Run on manual trigger OR if the build workflow succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Pull container image
        run: docker pull ${{ env.DOCKER_IMAGE }}

      # Source SBOM (lockfiles) + the image's OS packages -> Dependency-Track,
      # then the images and osv-scanner.toml decisions -> dtrack-panel.
      - name: SBOM + triage report
        uses: https://git.janhouse.lv/janhouse/sbom-tools-action/scan@v2
        with:
          project: ${{ secrets.DEPENDENCY_TRACK_PROJECT_NAME || 'jellyfin-year-in-review' }}
          project-version: latest
          images: git.janhouse.lv/janhouse/jellyfin-year-in-review
          container-image: ${{ env.DOCKER_IMAGE }}
          container-skip-files: '/app/**'
          dtrack-url: ${{ secrets.DEPENDENCY_TRACK_URL }}
          dtrack-api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
