name: Builder
run-name: ${{ gitea.actor }} is building project 🚀
on:
  workflow_dispatch:
  # Weekly rebuild so the image picks up base-image and OS security
  # updates even when the code hasn't changed.
  schedule:
    - cron: "10 4 * * 6"

env:
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Weekly rebuild: drop the build cache first, so the image's
      # `apk/apt upgrade` layer really re-runs (a cached one installs nothing).
      - name: Clear the build cache (weekly rebuild)
        if: github.event_name == 'schedule'
        run: docker builder prune -af
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Build Docker image
        run: docker compose build --pull jellyfin-year-in-review
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      - name: Push Docker image
        run: docker compose push jellyfin-year-in-review
      